<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Support Panel | Isanka</title>
    
    <!-- Icons from FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00f3ff; /* Cyan */
            --secondary-color: #bc13fe; /* Purple */
            --bg-dark: #050510;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        /* Main Container (Glass Box) */
        .main-container {
            width: 90%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), var(--glass-shadow);
            display: flex;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            position: relative;
            z-index: 10;
        }

        /* Left Side: Info Panel */
        .info-panel {
            flex: 1;
            padding: 40px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(188, 19, 254, 0.05));
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* --- NEW LOGO STYLES --- */
        .logo-container {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .logo-img {
            width: 100px; /* Logo width */
            height: auto;
            border-radius: 50%; /* Circular look - remove if square is preferred */
            padding: 5px;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .logo-img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 25px var(--primary-color), 0 0 10px #fff;
        }
        /* ------------------------ */

        .secret-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
            display: inline-block;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: default;
        }

        .info-card:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
        }

        .info-icon {
            font-size: 1.5rem;
            color: var(--primary-color);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 50%;
        }

        .info-text h4 {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 2px;
        }

        .info-text p {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .response-badge {
            margin-top: auto;
            background: linear-gradient(90deg, var(--secondary-color), #8a2be2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.4);
        }

        /* Right Side: Message Panel */
        .message-panel {
            flex: 1.5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel-header {
            margin-bottom: 30px;
        }

        .panel-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panel-header p {
            color: #888;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 15px 15px 15px 45px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .input-group textarea {
            resize: none;
            height: 120px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            transition: all 0.3s ease;
        }

        /* Focus Effects */
        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        .input-group input:focus + i,
        .input-group textarea:focus + i {
            color: var(--secondary-color);
            text-shadow: 0 0 5px var(--secondary-color);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--primary-color), #00a8ff);
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            z-index: 100;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 20px #25d366;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary-color);
            padding: 15px 25px;
            margin-bottom: 10px;
            border-radius: 4px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success { border-color: #00ff88; }
        .toast.info { border-color: var(--primary-color); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                width: 95%;
                margin: 20px 0;
            }

            .info-panel {
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 25px;
                align-items: center; /* Center items on mobile */
                text-align: center;
            }

            .logo-img {
                margin: 0 auto; /* Center logo */
            }

            .info-card {
                width: 100%; /* Full width cards */
                justify-content: center;
            }
            
            .message-panel {
                padding: 25px;
            }

            .panel-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <canvas id="particles-js"></canvas>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main Glass Card -->
    <div class="main-container">
        
        <!-- Left Side: Info Panel -->
        <div class="info-panel">
            
            <!-- NEW LOGO SECTION -->
            <div class="logo-container">
                <!-- target="_blank" opens in new tab -->
                <a href="https://files.catbox.moe/ltx4wm.png" target="_blank">
                    <img src="https://files.catbox.moe/ltx4wm.png" alt="Secret Logo" class="logo-img">
                </a>
            </div>
            <!-- ------------------- -->

            <div class="secret-badge">
                <i class="fas fa-lock"></i> Secure System

            <h3 style="margin-bottom: 20px; font-family: 'Orbitron';">Agent Info</h3>

            <!-- Location -->
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="info-text">
                    <h4>Base Location</h4>
                    <p>Kosdeniya, LK</p>
                </div>
            </div>

            <!-- Phone -->
            <a href="tel:+94763353368" class="info-card" style="text-decoration: none; color: inherit;">
                <div class="info-icon">
                    <i class="fas fa-phone-alt"></i>
                </div>
                <div class="info-text">
                    <h4>Direct Line</h4>
                    <p>+94 76 335 3368</p>
                </div>
            </a>

            <!-- Email (Click to Copy) -->
            <div class="info-card" onclick="copyEmail()" title="Click to copy email">
                <div class="info-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="info-text">
                    <h4>Secure Email</h4>
                    <p>isankamalith74@gmail.com</p>
                </div>
                <i class="fas fa-copy" style="margin-left: auto; color: #666; font-size: 0.8rem;"></i>
            </div>

            <!-- Response Time -->
            <div class="response-badge">
                <i class="fas fa-bolt"></i> Avg Response: 24 Hours
            </div>
        </div>

        <!-- Right Side: Message Form -->
        <div class="message-panel">
            <div class="panel-header">
                <h2>Send Encrypted Msg</h2>
                <p>We will reply you via secure channel.</p>
            </div>

            <form id="contactForm">
                <div class="input-group">
                    <input type="text" id="name" placeholder="Your Code Name" required>
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Contact Frequency (Email)" required>
                    <i class="fas fa-at"></i>
                </div>

                <div class="input-group">
                    <input type="text" id="subject" placeholder="Mission Subject" required>
                    <i class="fas fa-fingerprint"></i>
                </div>

                <div class="input-group">
                    <textarea id="message" placeholder="Type your confidential message here..." required></textarea>
                    <i class="fas fa-comment-dots"></i>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i> Send Secure Message 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/94763353368" class="whatsapp-float" target="_blank" title="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // --- 1. Particle Animation Logic (Vanilla JS) ---
        const canvas = document.getElementById('particles-js');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        // Get Mouse Position
        let mouse = {
            x: null,
            y: null,
            radius: (canvas.height/80) * (canvas.width/80)
        }

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Create Particle
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            // Method to draw individual particle
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = '#00f3ff';
                ctx.fill();
            }
            // Check particle position, check mouse position, move the particle, draw the particle
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                // Check collision detection - mouse position / particle position
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < mouse.radius + this.size){
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                        this.x += 10;
                    }
                    if (mouse.x > this.x && this.x > this.size * 10) {
                        this.x -= 10;
                    }
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                        this.y += 10;
                    }
                    if (mouse.y > this.y && this.y > this.size * 10) {
                        this.y -= 10;
                    }
                }
                // Move particle
                this.x += this.directionX;
                this.y += this.directionY;
                // Draw particle
                this.draw();
            }
        }

        // Create Particle Array
        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size.height - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 2) - 1; // Speed
                let directionY = (Math.random() * 2) - 1;
                let color = '#00f3ff';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0,0,innerWidth, innerHeight);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        // Check if particles are close enough to draw line
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                    + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        ctx.strokeStyle = 'rgba(188, 19, 254,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[b].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Resize event
        window.addEventListener('resize', function() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            mouse.radius = ((canvas.height/80) * (canvas.height/80));
            init();
        });

        // Mouse out event
        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        init();
        animate();


        // --- 2. Form Handling & Interactions ---

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-info-circle"></i>';
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            // Trigger animation
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 3000);
        }

        // Copy Email Function
        function copyEmail() {
            const email = "isankamalith74@gmail.com";
            navigator.clipboard.writeText(email).then(() => {
                showToast("Email Copied to Clipboard!", "success");
            }).catch(err => {
                showToast("Failed to copy email", "info");
            });
        }

        // Form Submit
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simulate sending process
            const btn = document.querySelector('.submit-btn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Encrypting & Sending...';
            btn.style.opacity = '0.7';

            setTimeout(() => {
                // Success Action
                showToast("Message Sent Securely! We will reply soon.", "success");
                
                // Clear Form
                document.getElementById('contactForm').reset();
                
                // Reset Button
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
            }, 1500);
        });

    </script>
</body>
